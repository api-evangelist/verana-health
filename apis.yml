name: Verana Health
description: 'Verana Health is a healthcare real-world data (RWD) and analytics company
  that transforms de-identified electronic health records from more than 90 million
  patients across 50+ EHR systems into curated, disease-specific datasets for life
  sciences and clinical research. Its VeraQ population health data engine harmonizes,
  tokenizes, and links structured and unstructured EHR data, claims, and medical images
  using clinician-directed curation, natural language processing, and machine learning,
  delivering Qdata modules across ophthalmology, urology, and neurology. Verana partners
  with medical specialty societies (including the AAO IRIS Registry) to power trial
  design, site and patient identification, real-world evidence studies, and quality-measure
  reporting. The company is HIPAA-compliant and surfaced in the API Evangelist network
  as a portfolio company of GV. No public developer API or developer portal is published
  as of this profile.'
